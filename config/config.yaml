blocksize: 1024
fs: 192000
channels: 8
dtype: "int24"
default_file: "single_bat_1234.wav"
default_layout: "single_bat_1234.csv"
default_device: 10 # WOOOW CABLE Output  (VB-Audio V, MME (16 in, 0 out)

# Tunable parameters
call_time : 0.03 # minimum call duration in seconds, used to set the minimum size of the call chunk to process
event_time : 15


# Source detection parameters
vsound: 340
threshold: 1e-1

# Butterworth highpass filter parameters
filter_order: 1
cutoff_freq: 10000

# Queue parameters - adjust if some chunks are being dropped
audio_queue_maxsize: 40
results_queue_maxsize: 20

#session parameters
event_max_sleep_time: 1 # max inactive time before quitting an event
max_event_time: 10      # max duration of an event


# GUI parameters
update_fps: 10
buffer_length: 10

#logging
logging:
  default_level: WARNING
  levels:
    processing: DEBUG
    AudioInput: WARNING
    