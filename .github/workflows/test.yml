name: Run Tests
# Run the test suite on pull requests and pushes to main branch
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * Sun'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.5.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install hatch
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch
    - name: Run test suite
      run: hatch run +py=${{ matrix.python-version }} test:run
    # If you use this step and have a private repo- then you will need to get a
    # token from codecov and
    # save it as a github secret called CODECOV_TOKEN
    - name: Upload to codecov
      if: runner.os == 'macOS' && matrix.python-version == '3.13'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        #token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        files: ./coverage.xml

